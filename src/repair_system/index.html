<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧校园 - 敏捷报修终端</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: #1e3a8a; }
        .asset-card { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px; border-radius: 6px; margin-bottom: 25px; }
        .asset-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
        .asset-label { color: #64748b; }
        .asset-value { font-weight: bold; color: #1e293b; }
        .tag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .tag-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px 10px; border-radius: 8px; text-align: center; cursor: pointer; }
        .tag-btn.active { background: #ebf8ff; border-color: #3b82f6; color: #1d4ed8; font-weight: bold; }
        .submit-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 80%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="pageTitle">扫码极速报修</h2>
        <p>智慧校园 · 数字化感知终端</p>
    </div>

    <div class="asset-card">
        <div class="asset-row">
            <span class="asset-label">当前位置</span>
            <span class="asset-value" id="dom_location">正在获取定位...</span>
        </div>
        <div class="asset-row">
            <span class="asset-label">设备类型</span>
            <span class="asset-value" id="dom_device">通用多媒体设备</span>
        </div>
        <div class="asset-row">
            <span class="asset-label">资产编号</span>
            <span class="asset-value" id="dom_asset_id">LOADING...</span>
        </div>
    </div>

    <div class="tag-grid" id="faultTags">
        <div class="tag-btn" onclick="toggleTag(this)">屏幕黑屏</div>
        <div class="tag-btn" onclick="toggleTag(this)">触摸无反应</div>
        <div class="tag-btn" onclick="toggleTag(this)">无声音</div>
        <div class="tag-btn" onclick="toggleTag(this)">系统死机</div>
    </div>

    <button class="submit-btn" onclick="submitRepair()">一键提交报修工单</button>
</div>

<div class="modal" id="successModal">
    <div class="modal-content">
        <div style="font-size: 40px; color: #10b981;">✔</div>
        <div style="font-size: 18px; font-weight: bold;">报修已提交</div>
        <p id="confirmMsg" style="font-size: 14px; color: #6b7280;"></p>
    </div>
</div>

<script>
    // 解析 URL 中的参数
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            room: params.get('room') || '未定义教室',
            device: params.get('device') || '交互式白板',
            id: params.get('id') || 'SN-UNKNOWN'
        };
    }

    // 页面加载时自动填入数据
    window.onload = function() {
        const data = getUrlParams();
        document.getElementById('dom_location').innerText = decodeURIComponent(data.room);
        document.getElementById('dom_device').innerText = decodeURIComponent(data.device);
        document.getElementById('dom_asset_id').innerText = data.id;
    };

    function toggleTag(el) { el.classList.toggle('active'); }

    function submitRepair() {
        const data = getUrlParams();
        document.getElementById('confirmMsg').innerText = `已为 ${data.room} 派单，请稍候。`;
        document.getElementById('successModal').style.display = 'flex';
        setTimeout(() => { location.reload(); }, 2500);
    }
</script>

</body>
</html>
